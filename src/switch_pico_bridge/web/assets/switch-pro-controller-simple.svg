<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="570" viewBox="0 0 800 570" role="img" aria-labelledby="title description">
  <title id="title">Nintendo Switch Pro Controller — original model</title>
  <desc id="description">Front-view original Nintendo Switch Pro Controller, with a smoky charcoal face, separate dark grip panels, black shoulder buttons, offset analog sticks, cross directional pad, Nintendo ABXY layout, capture and home buttons, and lower player indicators. Transparent background. Lightweight vector shapes and simple gradients; no filters, textures, fonts or external images.</desc>
  <metadata>Visual reference: https://www.nintendo.com/us/store/products/pro-controller/ . Independently drawn vector artwork.</metadata>

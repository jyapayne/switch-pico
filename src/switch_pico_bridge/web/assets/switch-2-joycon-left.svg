    </g>
    <g id="stick">
      <circle cy="2" r="46" fill="#172127" />
      <circle r="43" fill="#39464d" stroke="currentColor" stroke-width="3" />
      <circle cy="-1" r="38.5" fill="#182329" />
      <circle cy="-2" r="35.5" fill="#56646c" />
      <circle cy="-2" r="29.5" fill="url(#dish)" stroke="#202b32" stroke-width="2" />
      <path d="M0-40V-32M-38-2H-31M31-2H38M0 29V36" fill="none" stroke="#1a252c" stroke-width="2" stroke-linecap="round" />
    </g>
    <g id="capture">

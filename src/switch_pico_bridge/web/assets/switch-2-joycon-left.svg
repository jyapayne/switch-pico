      <rect x="-13.5" y="-14" width="27" height="27" rx="2.5" fill="url(#button)" stroke="#626e76" stroke-width="1" />
      <circle cy="-1" r="9.5" fill="none" stroke="#1c2830" stroke-width="1.4" />
      <path d="M-9 2A9.5 9.5 0 0 0 9 2" fill="none" stroke="#738188" stroke-width=".8" />
    </g>
  </defs>
  <g id="left-joycon" aria-label="Left Joy-Con 2">

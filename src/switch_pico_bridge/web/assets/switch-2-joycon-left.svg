    <path d="M158 9H144C58 9 5 64 4 138" fill="none" stroke="#79848a" stroke-opacity=".7" stroke-width="1.5" />
    <path d="M4 390C8 483 39 531 143 533H157" fill="none" stroke="#4c585f" stroke-width="1.2" />

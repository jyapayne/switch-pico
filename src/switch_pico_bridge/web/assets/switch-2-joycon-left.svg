      <stop stop-color="#3b4348" />
      <stop offset="1" stop-color="#20262b" />
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#4b555a" />
      <stop offset="1" stop-color="#293137" />
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2=".4" y2="1">
      <stop stop-color="#505b62" />
      <stop offset="1" stop-color="#303a41" />
    </linearGradient>
    <radialGradient id="dish" cx="50%" cy="90%" r="100%">
      <stop stop-color="#283239" />
      <stop offset="1" stop-color="#424f58" />
    </radialGradient>
    <path id="right-shell" d="M3 5H20C111 5 164 61 164 139V376C164 482 132 537 20 537H3Z" />
    <g id="key">
